<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9F1239">
  <title>Bimska — Bimbingan Skripsi UNSIKA</title>

  <!-- Percepat koneksi pertama: server API (Apps Script) dan font -->
  <link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Mulai memanggil server SEKARANG: config + api dimuat lebih dulu (kecil), paralel dengan CSS & font -->
  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <!-- Font: Plus Jakarta Sans + Material Symbols (sumbu variabel dipangkas agar ringan) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400..600,0..1&display=block" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%239F1239'/%3E%3Cpath d='M32 14 8 26l24 12 24-12zM16 34v10c0 4 8 8 16 8s16-4 16-8V34l-16 8z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Naikkan angka ?v= bila Anda memperbarui berkas, agar browser mengambil versi terbaru -->
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <!-- Penjaga: tampilkan galat JavaScript di layar (membantu diagnosis) -->
  <script>
    window.__bimskaBooted = false; window.__bimskaLoaded = false; window.__errs = [];
    function __showFatal(msg) {
      var c = document.getElementById('app-container'); if (!c) return;
      var esc = function (t) { return String(t).replace(/[<>&]/g, ' '); };
      c.innerHTML = '<div style="max-width:620px;margin:2rem auto;padding:1.25rem;border-radius:1.25rem;background:#FEF3C7;color:#78350F;font:14px/1.6 sans-serif"><b>Bimska belum bisa dimuat</b><br>' + esc(msg) + (window.__errs.length ? '<br><br><b>Galat pertama:</b><br><code style="word-break:break-word">' + esc(window.__errs[0]) + '</code>' : '') + '<br><br><small>Status berkas JavaScript: ' + (window.__bimskaLoaded ? 'terbaca lengkap' : 'TIDAK terbaca/terpotong') + '. Kirim tangkapan layar ini.</small></div>';
    }
    window.addEventListener('error', function (e) { window.__errs.push((e.message || 'Galat skrip') + (e.lineno ? ' [baris ' + e.lineno + ']' : '') + (e.filename ? ' ' + String(e.filename).slice(-40) : '')); });
    setTimeout(function () { if (!window.__bimskaBooted) __showFatal('Aplikasi tidak berhasil dimulai.'); }, 8000);
  </script>
  <!-- Latar organik + indikator muat -->
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="loadBar" class="topbar-load" role="progressbar" aria-label="Memuat"></div>

  <!-- ===== App bar (muncul setelah masuk) ===== -->
  <header id="appbar" class="appbar" style="display:none">
    <div class="mx-auto flex h-16 w-full max-w-[1200px] items-center justify-between gap-3 px-4">
      <div class="flex min-w-0 items-center gap-2.5">
        <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-2xl text-white" style="background:linear-gradient(135deg,rgb(var(--brand-btn)),rgb(var(--gold)))" aria-hidden="true">
          <span class="material-symbols-outlined ms-fill">school</span>
        </div>
        <div class="flex min-w-0 flex-col">
          <span class="flex items-center gap-1.5 text-[11px] font-extrabold uppercase leading-none tracking-wider text-brandtx">Bimska <span class="chip chip-rose hide-m">UNSIKA FASILKOM</span></span>
          <span id="pageTitle" class="clamp1 text-base font-bold leading-tight text-ink hide-d">Home</span>
        </div>
      </div>
      <nav id="navTop" class="topnav-pill hide-m" aria-label="Menu utama"></nav>
      <div class="flex flex-shrink-0 items-center gap-0.5">
        <button class="icon-btn" data-act="toggleTheme" aria-label="Ganti mode terang/gelap"><span id="themeIcon" class="material-symbols-outlined">dark_mode</span></button>
        <button class="icon-btn" data-act="openNotif" aria-label="Notifikasi"><span class="material-symbols-outlined">notifications</span><span id="notifDot" class="dot" style="display:none">0</span></button>
        <button id="avatarBtn" class="rounded-full p-0.5" style="background:linear-gradient(135deg,rgb(var(--brand-btn)),rgb(var(--gold)))" data-act="nav" data-page="profil" aria-label="Profil saya"></button>
      </div>
    </div>
  </header>

  <!-- ===== Kontainer tunggal SPA: semua halaman disuntikkan di sini ===== -->
  <div class="page">
    <main id="app-container" class="mx-auto w-full max-w-[1200px] flex-1" aria-live="polite"><p style="text-align:center;padding:3rem 1rem;color:#6B7280;font:14px sans-serif">Memuat Bimska…</p></main>
    <footer class="footnote">A little project by Siska, Fasilkom</footer>
  </div>

  <!-- ===== Navigasi bawah (ponsel) ===== -->
  <nav id="navBottom" class="bottomnav hide-d" style="display:none" aria-label="Menu utama"><div id="navBottomInner"></div></nav>

  <div id="modalRoot"></div>
  <div id="confirmRoot"></div>
  <div id="toastRoot" aria-live="assertive"></div>
  <div id="jobPill" class="job-pill" role="status" aria-live="polite"></div>

  <!-- Urutan penting: swr → inti → halaman → aksi (yang terakhir memulai aplikasi). defer = diunduh paralel, dijalankan berurutan -->
  <script defer src="js/swr.js?v=2"></script>
  <script defer src="js/core.js?v=2"></script>
  <script defer src="js/pages-utama.js?v=2"></script>
  <script defer src="js/pages-bimbingan.js?v=2"></script>
  <script defer src="js/aksi.js?v=2"></script>
</body>
</html>
